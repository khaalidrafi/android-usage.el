name: ci
# Landing gate: byte-compile (warnings = errors) + full ERT + loader smoke,
# on stock emacs 30.1 — same gate used for the Android-compat certification.
on:
  push:
    branches: ['ai/**', main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        emacs-version: ['30.1']
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs ${{ matrix.emacs-version }}
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Byte-compile (warnings are errors)
        run: |
          emacs --batch -L . \
            --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile android-usage.el

      - name: ERT
        run: emacs --batch -L . -l test -f ert-run-tests-batch-and-exit

      - name: Loader smoke
        run: |
          emacs --batch -L . -l android-usage --eval \
            '(princ "android-usage loaded ok\n")'
